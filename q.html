let errorList = JSON.parse(localStorage.getItem("errList")) || [];
let currentIndex = -1;
let useErrorMode = false;
let filterList = [];
let shufflePool = [];

//导出错题文本复制剪贴板
async function exportErrText(){
    if(errorList.length===0){
        alert("错题本为空！");
        return;
    }
    let txt = "=====434国商错题本=====\n";
    errorList.forEach((item,idx)=>{
        txt +=`\n${idx+1}.【${item.chapter}】${item.q}\n答案：${item.a}\n`;
    });
    try{
        await navigator.clipboard.writeText(txt);
        alert("✅错题已经复制到剪贴板！可以粘贴到Word、记事本打印背诵");
    }catch(e){
        alert("复制失败，请手动全选复制文本框内内容：\n"+txt);
    }
}

//键盘快捷键
document.addEventListener('keydown',function(e){
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.code==="Space"){
        e.preventDefault();
        toggleAnswer();
    }else if(e.code==="ArrowLeft"){
        e.preventDefault();
        prevQuestion();
    }else if(e.code==="ArrowRight"){
        e.preventDefault();
        nextQuestion();
    }
});

function initChapterSelect(){
    const sel = document.getElementById("chapterSel");
    const chapters = [...new Set(questionList.map(i=>i.chapter))];
    chapters.forEach(ch=>{
        let opt = document.createElement("option");
        opt.value = ch;
        opt.innerText = ch;
        sel.appendChild(opt);
    })
    document.getElementById("total").innerText = questionList.length;
    refreshErrCount();
}

function refreshErrCount(){
    document.getElementById("errCount").innerText = errorList.length;
    localStorage.setItem("errList",JSON.stringify(errorList));
}

function getFilterQuestions(){
    useErrorMode = false;
    const selVal = document.getElementById("chapterSel").value;
    if(selVal === "all"){
        filterList = [...questionList];
    }else{
        filterList = questionList.filter(x=>x.chapter === selVal);
    }
    document.getElementById("chCount").innerText = filterList.length;
    //随机模式初始化乱序池
    const mode = document.getElementById("modeSel").value;
    if(mode==="rand"){
        shufflePool = [...filterList].sort(()=>Math.random()-0.5);
    }else{
        shufflePool = [...filterList];
    }
    return filterList;
}

function loadErrorList(){
    if(errorList.length ===0){
        alert("错题本为空！");
        return;
    }
    useErrorMode = true;
    filterList = [...errorList];
    shufflePool = [...filterList];
    document.getElementById("chCount").innerText = filterList.length;
    currentIndex = -1;
    nextQuestion();
}

function nextQuestion(){
    const ansBox = document.getElementById("answerBox");
    ansBox.style.display = "none";
    if(!useErrorMode) getFilterQuestions();
    if(shufflePool.length ===0){
        document.getElementById("questionBox").innerText="该分类下没有题目";
        document.getElementById("chapName").innerText="";
        document.getElementById("curNo").innerText = "-";
        return;
    }
    currentIndex = (currentIndex +1) % shufflePool.length;
    renderQuestion();
}

function prevQuestion(){
    const ansBox = document.getElementById("answerBox");
    ansBox.style.display = "none";
    if(!useErrorMode) getFilterQuestions();
    if(shufflePool.length ===0){
        document.getElementById("questionBox").innerText="该分类下没有题目";
        document.getElementById("chapName").innerText="";
        document.getElementById("curNo").innerText = "-";
        return;
    }
    currentIndex = (currentIndex -1 + shufflePool.length) % shufflePool.length;
    renderQuestion();
}

function renderQuestion(){
    const item = shufflePool[currentIndex];
    document.getElementById("questionBox").innerText = item.q;
    document.getElementById("answerBox").innerText = item.a;
    document.getElementById("chapName").innerText = "【"+item.chapter+"】";
    document.getElementById("curNo").innerText = `${currentIndex+1}/${shufflePool.length}`;
}

function toggleAnswer(){
    const ansBox = document.getElementById("answerBox");
    ansBox.style.display = ansBox.style.display === "block" ? "none":"block";
}

function markRight(){
    if(currentIndex<0) return;
    const obj = shufflePool[currentIndex];
    errorList = errorList.filter(it=>!(it.q === obj.q && it.chapter===obj.chapter));
    refreshErrCount();
    nextQuestion();
}

function markWrong(){
    if(currentIndex<0) return;
    const obj = shufflePool[currentIndex];
    const exist = errorList.some(it=>it.q === obj.q && it.chapter===obj.chapter);
    if(!exist){
        errorList.push(obj);
    }
    refreshErrCount();
    nextQuestion();
}

window.onload = function(){
    initChapterSelect();
}
